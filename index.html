<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clinic ID Badge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@600;700&display=swap" rel="stylesheet">
<style>
/*
  Cleveland Clinic ID badge mockup. HTML + CSS only; the portrait is the one image.

  Swap the person: change the <img src>, the two name lines and the credential.
  Any portrait works; --focus sets where the crop sits (default 50% 22%).

  Hover (or keyboard focus) pulls the badge off the reel: the cord pays out,
  the card lifts toward you, swings, and tilts toward whichever part of the card
  the pointer is over (a 4x3 grid of invisible hotspots read with :has()).
  The laminate glare and a faint holographic sheen follow the pointer.
  Moving off lets the spring reel snap it back with a small bounce.
*/

/* Registered so they animate (Chrome, Safari 16.4+, Firefox 128+). Without
   @property the states still work; they just snap instead of easing. */
@property --pull { syntax: '<length>';     inherits: true; initial-value: 0px; }
@property --lift { syntax: '<number>';     inherits: true; initial-value: 0; }
@property --rx   { syntax: '<angle>';      inherits: true; initial-value: 0deg; }
@property --ry   { syntax: '<angle>';      inherits: true; initial-value: 0deg; }
@property --rz   { syntax: '<angle>';      inherits: true; initial-value: 0deg; }
@property --px   { syntax: '<percentage>'; inherits: true; initial-value: 50%; }
@property --py   { syntax: '<percentage>'; inherits: true; initial-value: 30%; }

:root {
  --cc-blue: #19539f;
  --cc-green: #2c7f3a;
  --ink: #2d2e32;
  --scrub: #1a2745;
  --twill:
    repeating-linear-gradient(63deg, rgb(255 255 255 / .045) 0 1px, rgb(255 255 255 / 0) 1px 3px),
    repeating-linear-gradient(-27deg, rgb(0 0 0 / .16) 0 1px, rgb(0 0 0 / 0) 1px 4px);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }

body {
  min-height: 100vh;
  background-color: var(--scrub);
  background-image: var(--twill),
    radial-gradient(90% 70% at 38% 16%, #2b3e6c 0%, #1a2745 55%, #0f182d 100%);
  font-family: "Frutiger", "Hind", "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}

/* ---------- Scene: a navy scrub top with a chest pocket ---------- */

.scene {
  position: relative;
  min-height: 100vh;
  overflow: clip;
  display: flex;
  justify-content: center;
  padding: 6em 16px 3em;
  font-size: clamp(7px, 2.4vw, 13px); /* the whole rig is sized in em */
}

/* Soft light from the upper left, falloff at the edges. */
.scene::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(75% 60% at 45% 30%, rgb(0 0 0 / 0) 40%, rgb(0 0 0 / .5) 100%);
  z-index: 4;
}

.pocket {
  position: absolute;
  top: calc(6em - 1.1em);
  left: 50%;
  bottom: -1em;
  width: 62em;
  translate: -50% 0;
  border-radius: .35em .35em 0 0;
  background-color: #1d2b4d;
  background-image: var(--twill),
    linear-gradient(180deg, #26385f 0%, #1c2a4a 30%, #172340 100%);
  box-shadow:
    0 -1px 0 rgb(0 0 0 / .55),
    inset 0 1px 0 rgb(255 255 255 / .16),
    0 0 1.6em rgb(0 0 0 / .3);
}

/* Folded hem at the pocket mouth: two rows of top-stitching over a shadowed fold. */
.pocket::before {
  content: "";
  position: absolute;
  inset: 0 0 auto;
  height: 2.5em;
  border-radius: inherit;
  --stitch: repeating-linear-gradient(90deg, rgb(160 178 222 / .7) 0 .55em, rgb(0 0 0 / 0) .55em .9em);
  --stitch-shadow: repeating-linear-gradient(90deg, rgb(0 0 0 / .45) 0 .55em, rgb(0 0 0 / 0) .55em .9em);
  background:
    var(--stitch) 0 .62em / 100% .1em no-repeat,
    var(--stitch-shadow) .04em .72em / 100% .08em no-repeat,
    var(--stitch) 0 1.9em / 100% .1em no-repeat,
    var(--stitch-shadow) .04em 2em / 100% .08em no-repeat,
    linear-gradient(180deg, rgb(255 255 255 / .12), rgb(255 255 255 / 0) 30%, rgb(0 0 0 / .22));
  border-bottom: 1px solid rgb(0 0 0 / .4);
  box-shadow: 0 1px 0 rgb(255 255 255 / .06), 0 .25em .4em rgb(0 0 0 / .18);
}

/* Side seams. */
.pocket::after {
  content: "";
  position: absolute;
  inset: 2.5em 0 0;
  --seam: repeating-linear-gradient(180deg, rgb(160 178 222 / .6) 0 .55em, rgb(0 0 0 / 0) .55em .9em);
  background:
    var(--seam) .7em 0 / .1em 100% no-repeat,
    var(--seam) calc(100% - .7em) 0 / .1em 100% no-repeat;
}

/* ---------- The badge (the whole rig is one link) ---------- */

.badge {
  --pull: 0px;
  --lift: 0;
  --rx: 0deg;
  --ry: 0deg;
  --rz: 0deg;
  --px: 50%;
  --py: 30%;
  position: relative;
  z-index: 1;
  display: block;
  flex: none;
  width: 34em;
  height: 44em;
  color: inherit;
  text-decoration: none;
  outline: none;
  -webkit-tap-highlight-color: transparent;
  /* Letting go: the spring yanks it home and it clacks into the reel. */
  transition:
    --pull .5s cubic-bezier(.55, 0, .3, 1.45),
    --lift .45s ease-in,
    --rx .6s cubic-bezier(.3, 1.3, .5, 1),
    --ry .6s cubic-bezier(.3, 1.3, .5, 1),
    --rz .6s cubic-bezier(.3, 1.3, .5, 1),
    --px .8s ease,
    --py .8s ease;
}

.badge:hover,
.badge:focus-visible {
  --pull: 5.5em;
  --lift: 1;
  --rx: 9deg;
  --px: 50%;
  --py: 45%;
  /* Reaching for it: a smooth pull against the spring. */
  transition:
    --pull .75s cubic-bezier(.2, .9, .25, 1),
    --lift .6s cubic-bezier(.2, .9, .25, 1),
    --rx .5s cubic-bezier(.25, 1.25, .45, 1),
    --ry .5s cubic-bezier(.25, 1.25, .45, 1),
    --rz .5s cubic-bezier(.25, 1.25, .45, 1),
    --px .45s ease-out,
    --py .45s ease-out;
}

/* Pointer tracking without JS: which of the 12 hotspots is hovered sets the tilt
   and where the glare sits. Columns tip the card left/right, rows set how far
   the bottom lifts toward you. */
.badge:has(.hs i:nth-child(1):hover)  { --ry: -11deg; --rz: -.8deg; --px: 12%; --rx: 16deg; --py: 17%; }
.badge:has(.hs i:nth-child(2):hover)  { --ry: -4deg;  --rz: -.3deg; --px: 37%; --rx: 16deg; --py: 17%; }
.badge:has(.hs i:nth-child(3):hover)  { --ry: 4deg;   --rz: .3deg;  --px: 63%; --rx: 16deg; --py: 17%; }
.badge:has(.hs i:nth-child(4):hover)  { --ry: 11deg;  --rz: .8deg;  --px: 88%; --rx: 16deg; --py: 17%; }
.badge:has(.hs i:nth-child(5):hover)  { --ry: -11deg; --rz: -.8deg; --px: 12%; --rx: 10deg; --py: 50%; }
.badge:has(.hs i:nth-child(6):hover)  { --ry: -4deg;  --rz: -.3deg; --px: 37%; --rx: 10deg; --py: 50%; }
.badge:has(.hs i:nth-child(7):hover)  { --ry: 4deg;   --rz: .3deg;  --px: 63%; --rx: 10deg; --py: 50%; }
.badge:has(.hs i:nth-child(8):hover)  { --ry: 11deg;  --rz: .8deg;  --px: 88%; --rx: 10deg; --py: 50%; }
.badge:has(.hs i:nth-child(9):hover)  { --ry: -11deg; --rz: -.8deg; --px: 12%; --rx: 4deg;  --py: 83%; }
.badge:has(.hs i:nth-child(10):hover) { --ry: -4deg;  --rz: -.3deg; --px: 37%; --rx: 4deg;  --py: 83%; }
.badge:has(.hs i:nth-child(11):hover) { --ry: 4deg;   --rz: .3deg;  --px: 63%; --rx: 4deg;  --py: 83%; }
.badge:has(.hs i:nth-child(12):hover) { --ry: 11deg;  --rz: .8deg;  --px: 88%; --rx: 4deg;  --py: 83%; }

/* ---------- Retractable reel ---------- */

.reel {
  position: absolute;
  top: 0;
  left: 50%;
  width: 7em;
  height: 7em;
  margin-left: -3.5em;
  z-index: 3;
}

/* Spring belt clip on the back, bent over the pocket hem. */
.reel__clip {
  position: absolute;
  top: -1.9em;
  left: 50%;
  width: 2.3em;
  height: 5em;
  margin-left: -1.15em;
  border-radius: 1.1em 1.1em .3em .3em;
  background:
    linear-gradient(180deg, rgb(255 255 255 / .75) 0, rgb(255 255 255 / 0) .5em, rgb(0 0 0 / .25) .75em, rgb(0 0 0 / 0) 1.1em),
    repeating-linear-gradient(0deg, rgb(255 255 255 / .06) 0 1px, rgb(0 0 0 / .05) 1px 2px),
    linear-gradient(90deg, #7c818a, #e8ebef 20%, #aeb3ba 42%, #f6f7f9 58%, #9aa0a8 82%, #6f747c);
  box-shadow: .1em .25em .35em rgb(0 0 0 / .55);
}

/* Boss at the bottom where the cord comes out. */
.reel__nub {
  position: absolute;
  top: 5.8em;
  left: 50%;
  width: 2.1em;
  height: 1.55em;
  margin-left: -1.05em;
  border-radius: .35em .35em .7em .7em;
  background:
    radial-gradient(60% 50% at 50% 0, rgb(255 255 255 / .25), rgb(255 255 255 / 0)),
    linear-gradient(90deg, #0b1d50, #2a5cc2 32%, #1d48a2 64%, #0a1a48);
  box-shadow: .15em .3em .35em rgb(0 0 0 / .5), inset 0 -.1em .12em rgb(0 0 0 / .45);
}

.reel__nub::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: .18em;
  width: .6em;
  height: .32em;
  margin-left: -.3em;
  border-radius: 50%;
  background: radial-gradient(#000 40%, #0b1642);
  box-shadow: 0 .04em 0 rgb(255 255 255 / .18);
}

/* Injection-molded body: glossy royal blue with a rounded edge. */
.reel__body {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background:
    radial-gradient(circle at 30% 24%, rgb(255 255 255 / .7) 0 .2em, rgb(255 255 255 / .18) .9em, rgb(255 255 255 / 0) 1.9em),
    radial-gradient(circle at 70% 82%, rgb(120 170 255 / .35), rgb(120 170 255 / 0) 30%),
    radial-gradient(circle, #2659be 0 56%, #1b4196 68%, #112c6f 84%, #0a1d50 100%);
  box-shadow:
    inset 0 .2em .25em rgb(255 255 255 / .38),
    inset 0 -.4em .55em rgb(0 0 0 / .5),
    0 .1em .15em rgb(0 0 0 / .45),
    .45em 1em 1.3em rgb(0 0 0 / .5);
}

/* Raised rim ring around the face. */
.reel__body::before {
  content: "";
  position: absolute;
  inset: .45em;
  border-radius: 50%;
  box-shadow:
    0 0 0 .07em rgb(0 0 0 / .35),
    0 .09em .06em rgb(255 255 255 / .22),
    inset 0 .09em .1em rgb(0 0 0 / .35);
}

/* Epoxy-domed logo sticker. */
.reel__sticker {
  --cc-blue: #1f86d2;
  --cc-green: #259a3c;
  position: absolute;
  inset: .82em;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: radial-gradient(circle, #f7f6f2 62%, #e3e1da 100%);
  box-shadow:
    0 .06em .1em rgb(0 0 0 / .5),
    inset 0 -.14em .22em rgb(0 0 0 / .14),
    inset 0 .1em .12em rgb(255 255 255 / .9);
}

.reel__sticker .logo { --s: 2.85em; }

.reel__sticker::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background:
    radial-gradient(42% 28% at 36% 24%, rgb(255 255 255 / .95), rgb(255 255 255 / 0) 100%),
    radial-gradient(80% 80% at 50% 50%, rgb(255 255 255 / 0) 62%, rgb(255 255 255 / .55) 70%, rgb(255 255 255 / 0) 76%);
  transition: translate .6s cubic-bezier(.2, .9, .25, 1);
}

.badge:hover .reel__sticker::after,
.badge:focus-visible .reel__sticker::after { translate: .12em .08em; }

/* ---------- Logo mark (four notched quadrants) ---------- */

.logo {
  --s: 2.9em;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: calc(var(--s) * .07);
  width: var(--s);
  height: var(--s);
}

.logo i {
  display: block;
  border-radius: 22%;
  background: var(--c);
  -webkit-mask: conic-gradient(from 90deg at 58% 58%, #0000 25%, #000 0);
          mask: conic-gradient(from 90deg at 58% 58%, #0000 25%, #000 0);
}

.logo i:nth-child(1) { --c: var(--cc-blue); }
.logo i:nth-child(2) { --c: var(--cc-blue); rotate: 90deg; }
.logo i:nth-child(3) { --c: var(--cc-green); rotate: -90deg; }
.logo i:nth-child(4) { --c: var(--cc-green); rotate: 180deg; }

/* ---------- Everything that hangs and swings from the reel ---------- */

.pendulum {
  position: absolute;
  top: 7.2em;
  left: 0;
  width: 100%;
  z-index: 2;
  transform-origin: 17em 0;
  animation: settle 1.3s .3s ease-in-out;
}

.badge:hover .pendulum,
.badge:focus-visible .pendulum { animation: swing 2.2s .15s ease-in-out; }

@keyframes swing {
  0%   { rotate: 0deg; }
  16%  { rotate: 2.6deg; }
  36%  { rotate: -1.7deg; }
  56%  { rotate: 1deg; }
  76%  { rotate: -.45deg; }
  100% { rotate: 0deg; }
}

@keyframes settle {
  0%   { rotate: 0deg; }
  30%  { rotate: -1.2deg; }
  55%  { rotate: .7deg; }
  80%  { rotate: -.3deg; }
  100% { rotate: 0deg; }
}

/* The cord lives inside the reel; this window shows only what has paid out. */
.cord-well {
  position: absolute;
  top: 0;
  left: 50%;
  width: 1.6em;
  height: 9em;
  margin-left: -.8em;
  overflow: hidden;
}

.cord {
  position: absolute;
  left: 50%;
  bottom: calc(100% - .3em);
  width: .26em;
  height: 9em;
  margin-left: -.13em;
  border-radius: .13em;
  background:
    linear-gradient(90deg, rgb(0 0 0 / .4), rgb(0 0 0 / 0) 35%, rgb(0 0 0 / 0) 60%, rgb(0 0 0 / .45)),
    repeating-linear-gradient(-58deg, #f4f4f2 0 .09em, #aeb2b9 .09em .18em);
  box-shadow: .22em .35em .25em rgb(0 0 0 / .35);
  transform: translateY(var(--pull));
}

.hang {
  position: absolute;
  top: .3em;
  left: 0;
  width: 100%;
  height: 28em;
  perspective: 70em;
  perspective-origin: 50% 55%;
  transform: translateY(var(--pull));
}

/* ---------- Clear vinyl strap with snap ---------- */

.strap {
  position: absolute;
  top: -.25em;
  left: 50%;
  width: 1.9em;
  height: 5.85em;
  margin-left: -.95em;
  z-index: 3;
}

/* Crimped ferrule on the end of the cord. */
.strap__crimp {
  position: absolute;
  top: 0;
  left: 50%;
  width: .5em;
  height: .8em;
  margin-left: -.25em;
  border-radius: .12em;
  background: linear-gradient(90deg, #6e737b, #f1f3f6 40%, #a4a9b0 70%, #62676f);
  box-shadow: .1em .15em .2em rgb(0 0 0 / .4);
}

/* Split ring the strap loops through. */
.strap__ring {
  position: absolute;
  top: .5em;
  left: 50%;
  width: 1.05em;
  height: 1.05em;
  margin-left: -.525em;
  border-radius: 50%;
  background: conic-gradient(from 30deg, #767b84, #f4f6f8, #9aa0a8, #e6e9ed, #767b84, #d4d8dd, #767b84);
  -webkit-mask: radial-gradient(closest-side, #0000 calc(100% - .16em), #000 calc(100% - .15em) calc(100% - .01em), #0000 100%);
          mask: radial-gradient(closest-side, #0000 calc(100% - .16em), #000 calc(100% - .15em) calc(100% - .01em), #0000 100%);
  filter: drop-shadow(.08em .12em .08em rgb(0 0 0 / .45));
}

/* The loop of clear vinyl: bright refracting edges, faint tint, doubled where it overlaps. */
.strap__band {
  position: absolute;
  inset: .95em 0 0;
  border-radius: .95em .95em .8em .8em / .7em .7em .95em .95em;
  background:
    linear-gradient(180deg, rgb(255 255 255 / .35), rgb(255 255 255 / 0) .5em),
    linear-gradient(90deg, rgb(255 255 255 / .6) 0, rgb(255 255 255 / .12) 11%, rgb(255 255 255 / .03) 38%, rgb(255 255 255 / .1) 68%, rgb(255 255 255 / .5) 100%),
    rgb(205 228 238 / .13);
  box-shadow:
    inset 0 0 0 .06em rgb(255 255 255 / .5),
    inset .14em 0 .14em rgb(255 255 255 / .2),
    .22em .4em .45em rgb(0 0 0 / .32);
  -webkit-backdrop-filter: blur(.6px) saturate(1.25) brightness(1.18);
          backdrop-filter: blur(.6px) saturate(1.25) brightness(1.18);
}

/* Stitched-in highlight stripe down the vinyl. */
.strap__band::before {
  content: "";
  position: absolute;
  top: .35em;
  bottom: .4em;
  left: 22%;
  width: .16em;
  border-radius: .1em;
  background: linear-gradient(180deg, rgb(255 255 255 / .7), rgb(255 255 255 / .1));
}

/* Nickel snap. */
.strap__snap {
  position: absolute;
  top: 2.15em;
  left: 50%;
  width: 1.3em;
  height: 1.3em;
  margin-left: -.65em;
  border-radius: 50%;
  background: conic-gradient(from 15deg, #6f747d, #f3f5f8, #959ba4, #e9ecf0, #6f747d, #d3d7dc, #6f747d);
  box-shadow:
    0 0 0 .14em rgb(255 255 255 / .16),
    .1em .18em .22em rgb(0 0 0 / .5),
    inset 0 0 0 .06em rgb(0 0 0 / .25);
}

.strap__snap::after {
  content: "";
  position: absolute;
  inset: .3em;
  border-radius: 50%;
  background: radial-gradient(circle at 38% 32%, #fff 0 .06em, #dde1e6 .18em, #8e949d 100%);
  box-shadow: 0 0 0 .05em rgb(0 0 0 / .3), 0 .05em .06em rgb(255 255 255 / .6);
}

/* ---------- Card + clip, tilting in 3D ---------- */

.card-shadow {
  position: absolute;
  top: 6.3em;
  left: .4em;
  width: 33.2em;
  height: 21em;
  border-radius: 1.3em;
  background: rgb(2 4 12 / calc(.85 - var(--lift) * .25));
  filter: blur(calc(.45em + var(--lift) * 1.5em));
  translate: calc(.3em + var(--lift) * 1.6em) calc(.55em + var(--lift) * 2.9em);
  scale: calc(1 - var(--lift) * .04);
}

.card-assembly {
  position: absolute;
  top: 4.8em;
  left: 0;
  width: 34em;
  height: 23em;
  z-index: 1;
  transform-style: preserve-3d;
  transform-origin: 50% .9em;
  transform: rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(var(--rz));
}

/* Two plates behind the face give the PVC visible thickness when it tilts. */
.card-edge {
  position: absolute;
  top: 1.5em;
  left: 0;
  width: 34em;
  height: 21.4em;
  border-radius: 1.3em;
  background: linear-gradient(90deg, #bdbdb5, #deded8 50%, #b8b8b0);
  transform: translateZ(-.13em);
}

.card-edge + .card-edge {
  background: #a9a9a1;
  transform: translateZ(-.26em);
}

.card {
  position: absolute;
  top: 1.5em;
  left: 0;
  width: 34em;
  height: 21.4em;
  overflow: hidden;
  border-radius: 1.3em;
  color: var(--ink);
  /* Off-white so the specular white of the laminate has somewhere to go. */
  isolation: isolate;
  background: linear-gradient(172deg, #f9f9f6 0%, #f2f2ed 55%, #e9e9e3 100%);
  box-shadow:
    inset 0 .08em .06em rgb(255 255 255 / .95),
    inset 0 -.1em .12em rgb(0 0 0 / .06),
    0 0 0 .04em rgb(0 0 0 / .14);
}

.card__logo {
  position: absolute;
  top: 5.7em;
  left: 2.5em;
}

.card__who {
  position: absolute;
  top: 9.7em;
  left: 2.5em;
  width: 19.5em;
}

.card__name {
  display: block;
  font-size: 2.55em;
  font-weight: 700;
  line-height: 1.06;
  letter-spacing: -.012em;
}

.card__name span { display: block; }

.card__cred {
  display: block;
  margin-top: .32em;
  font-size: 2.05em;
  font-weight: 600;
  line-height: 1.05;
  letter-spacing: .01em;
  color: var(--cc-blue);
}

/* Dye-sub printed portrait: flat, a touch soft, under the laminate. */
.card__photo {
  position: absolute;
  top: 5.3em;
  right: 2.8em;
  width: 7.6em;
  height: 9.5em;
  overflow: hidden;
  border-radius: .12em;
  background: #dde1e4;
}

.card__photo img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: var(--focus, 50% 22%);
  filter: saturate(.9) contrast(.96) brightness(1.03);
}

.card__photo::after {
  content: "";
  position: absolute;
  inset: 0;
  box-shadow: inset 0 0 0 .05em rgb(0 0 0 / .07);
}

/* Laminate: a glare band plus a hot spot, both parked where the pointer is. */
.card__sheen {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background:
    radial-gradient(circle at var(--px) var(--py), rgb(255 255 255 / calc(var(--lift) * .38)) 0, rgb(255 255 255 / 0) 22%),
    linear-gradient(115deg, rgb(255 255 255 / 0) 42%, rgb(255 255 255 / calc(.16 + var(--lift) * .34)) 48%, rgb(255 255 255 / 0) 54%)
      calc(96% - var(--px)) 0 / 200% 100% no-repeat;
}

/* Faint holographic overlaminate that only shows at an angle. */
.card__holo {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  opacity: var(--lift);
  background:
    linear-gradient(115deg,
      rgb(0 0 0 / 0) 34%,
      hsl(185 90% 55% / .1) 40%,
      hsl(285 85% 65% / .09) 45%,
      hsl(45 95% 55% / .1) 50%,
      hsl(135 80% 50% / .08) 55%,
      rgb(0 0 0 / 0) 61%)
      calc(70% - var(--px) * .6) 0 / 240% 100% no-repeat;
}

/* White molded clip that grabs the card's slot punch. */
.tab {
  position: absolute;
  top: 0;
  left: 50%;
  width: 5em;
  height: 4.7em;
  margin-left: -2.5em;
  border-radius: .55em .55em .4em .4em;
  transform: translateZ(.14em);
  background:
    linear-gradient(180deg, rgb(0 0 0 / 0) 1.62em, rgb(0 0 0 / .1) 1.68em, rgb(255 255 255 / .95) 1.78em, rgb(0 0 0 / 0) 1.9em),
    linear-gradient(#c3c3bd, #c3c3bd) 50% 1.42em / 2.6em .1em no-repeat,
    linear-gradient(90deg, #d4d4cf 0, #f6f6f3 16%, #fff 50%, #f2f2ee 84%, #cfcfca 100%);
  box-shadow:
    inset 0 .08em .06em rgb(255 255 255 / .9),
    inset 0 -.12em .12em rgb(0 0 0 / .12),
    0 .1em 0 #c2c2bb,
    .12em .3em .45em rgb(0 0 0 / .3);
  /* Real hole for the strap to loop through. */
  -webkit-mask: linear-gradient(#000 0 0) 50% .45em / 2.6em .97em no-repeat, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask: linear-gradient(#000 0 0) 50% .45em / 2.6em .97em no-repeat exclude, linear-gradient(#000 0 0);
}

/* Focus ring for keyboard users, in Kent State gold. */
.badge:focus-visible .card { outline: .22em solid #eaab00; outline-offset: .35em; }

/* Invisible 4x3 hotspot grid over the card. */
.hs {
  position: absolute;
  top: 6.3em;
  left: 0;
  width: 34em;
  height: 21.4em;
  z-index: 5;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(3, 1fr);
}

.hs i { display: block; }

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

@media (prefers-reduced-motion: reduce) {
  .pendulum,
  .badge:hover .pendulum,
  .badge:focus-visible .pendulum { animation: none; }
  .badge { --rx: 0deg !important; --ry: 0deg !important; --rz: 0deg !important; }
  .badge,
  .badge:hover,
  .badge:focus-visible { transition: --pull .25s ease, --lift .25s ease, --px .25s ease, --py .25s ease; }
}
</style>
